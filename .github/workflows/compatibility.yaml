name: Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

concurrency:
  group: compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go version
      - name: Validate Docker dependency lockfile
        run: npx --yes yarn@1.22.22 install --frozen-lockfile --ignore-scripts --non-interactive
      - run: npm ci
      - name: Install regression compilers
        run: |
          sh compact-installer.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/compact" update 0.29.0
          "$HOME/.local/bin/compact" update 0.35.0
          "$HOME/.local/bin/compact" update 0.36.0
          "$HOME/.local/bin/compact" update 0.31.1
      - run: npm run test:state
      - run: go test -mod=mod -v ./...
        env:
          RUN_COMPACT_035_TESTS: "1"
          RUN_COMPACT_036_TESTS: "1"
      - run: go build ./...
      - run: go vet ./...
      - name: Exercise HTTP client cancellation through the Go and Node reader
        run: |
          go build -o e2e/.midnight-server ./cmd
          go version -m e2e/.midnight-server
          node --test e2e/http-cancellation.test.mjs e2e/preprod-rpc.test.mjs

  publish:
    name: Publish service image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.private
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve image tag
        id: image
        env:
          IMAGE_REPOSITORY: ${{ vars.MIDNIGHT_IMAGE_REPOSITORY }}
        shell: bash
        run: |
          if [[ ! "$IMAGE_REPOSITORY" =~ ^[a-z0-9-]+-docker\.pkg\.dev/[a-z0-9-]+/[a-z0-9-]+/[a-z0-9-]+$ ]]; then
            echo "::error::Set MIDNIGHT_IMAGE_REPOSITORY to an Artifact Registry image path"
            exit 1
          fi
          echo "registry=${IMAGE_REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"
          echo "tag=$IMAGE_REPOSITORY:source-sha-${GITHUB_SHA:0:7}-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.registry }}
          username: _json_key
          password: ${{ secrets.GCR_SA_KEY }}
      - name: Build and publish the service image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record the published image
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: printf 'Published %s at %s.\n' "$IMAGE_TAG" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
